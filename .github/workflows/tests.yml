name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify core has no third-party imports at runtime
        run: python -m webctf doctor

      - name: Install (editable) with dev extras for realistic fixtures
        run: python -m pip install -e ".[dev]"

      - name: CLI smoke test
        run: |
          python -m webctf --help
          python -m webctf plugins
          webctf --version

      - name: Run full test suite (warnings are errors)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  core-only:
    # Proves the tool works with ZERO third-party packages (bare Python).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run stdlib-only tests (no pip install at all)
        run: python -m unittest discover -s tests -v
