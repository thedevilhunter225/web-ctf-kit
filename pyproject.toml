[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-ctf-kit"
version = "0.2.0"
description = "Deterministic, no-AI autonomous Web CTF reconnaissance, analysis and exploitation toolkit."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "CTF Community"}]
keywords = ["ctf", "web-security", "scanner", "ssti", "sqli", "lfi", "xss", "security-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
# The core toolkit has NO required third-party dependencies: it runs on a bare
# Python 3.10+ install (e.g. stock Kali) using only the standard library.
dependencies = []

[project.optional-dependencies]
# Prettier terminal output (auto-detected; plain output otherwise).
rich = ["rich>=13"]
# Headless browser for XSS-execution confirmation / local admin-bot testing.
browser = ["playwright>=1.40"]
# Realistic Flask/Jinja2 fixtures and the test runner.
dev = ["flask>=3", "jinja2>=3", "pyyaml>=6", "pytest>=7"]
# Everything.
all = ["rich>=13", "playwright>=1.40", "flask>=3", "jinja2>=3", "pyyaml>=6", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/your-org/web-ctf-kit"
Issues = "https://github.com/your-org/web-ctf-kit/issues"

[project.scripts]
webctf = "webctf.cli:main"

[tool.setuptools.packages.find]
# Install only the library; never ship the deliberately-vulnerable test fixtures.
include = ["webctf*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
